<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIDAY AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050b18;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 20px;
    border-bottom: 1px solid #123d68;
}

header h1 {
    color: #00bfff;
    letter-spacing: 5px;
    margin: 0;
}

header p {
    color: #8aaacb;
    font-size: 12px;
}

.core {
    width: 145px;
    height: 145px;
    border: 3px solid #00bfff;
    border-radius: 50%;
    margin: 25px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #00cfff;
    font-size: 23px;
    box-shadow: 0 0 25px #008cff, inset 0 0 25px #008cff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 45px #00bfff,
        inset 0 0 35px #008cff;
    }
}

.status {
    text-align: center;
    color: #00d5ff;
    font-size: 13px;
}

#chat {
    height: 43vh;
    overflow-y: auto;
    padding: 15px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #07558b;
    margin-left: auto;
}

.bot {
    background: #14243a;
    border: 1px solid #0879b8;
    margin-right: auto;
}

.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #081426;
    padding: 12px;
    border-top: 1px solid #123d68;
}

.row {
    display: flex;
    gap: 7px;
}

input, select {
    background: #14243a;
    color: white;
    border: 1px solid #0879b8;
    border-radius: 9px;
    padding: 13px;
}

input {
    flex: 1;
    min-width: 0;
}

button {
    background: #008ed0;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px;
    font-weight: bold;
}

button:active {
    background: #005d99;
}

.options {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 10px;
}

.options button {
    flex: 1;
}

#language {
    width: 100%;
    margin-bottom: 10px;
}

</style>
</head>

<body>

<header>
    <h1>FRIDAY AI</h1>
    <p>YOUR PERSONAL AI ASSISTANT</p>
</header>

<div class="core">FRIDAY</div>

<div class="status" id="status">
    ● SYSTEM ONLINE
</div>

<div id="chat">
    <div class="message bot">
        Hello! I am FRIDAY AI. 💙
        <br>
        আমি আপনার ব্যক্তিগত AI assistant।
        <br>
        How can I help you?
    </div>
</div>

<div class="controls">

    <select id="language">
        <option value="bn-BD">বাংলা</option>
        <option value="en-US">English</option>
    </select>

    <div class="row">
        <input
            id="question"
            type="text"
            placeholder="Ask FRIDAY anything..."
            autocomplete="off"
        >

        <button id="sendBtn" onclick="sendMessage()">
            SEND
        </button>
    </div>

    <div class="options">
        <button onclick="startListening()">🎤 MIC</button>
        <button id="voiceBtn" onclick="toggleVoice()">🔊 VOICE ON</button>
        <button onclick="clearChat()">🗑 CLEAR</button>
    </div>

</div>

<script>

const API_URL =
"https://friday-ai.munyemislam.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

let voiceEnabled = true;
let conversation = [];

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage() {

    const text = input.value.trim();

    if (!text || sendBtn.disabled) return;

    addMessage(text, "user");

    input.value = "";

    conversation.push({
        role: "user",
        content: text
    });

    sendBtn.disabled = true;
    sendBtn.textContent = "...";

    statusText.textContent = "● FRIDAY IS THINKING";

    const loading = addMessage(
        "Please wait...",
        "bot"
    );

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                messages: conversation.slice(-20)
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "AI connection failed"
            );
        }

        if (!data.reply) {
            throw new Error("Empty AI response");
        }

        loading.remove();

        conversation.push({
            role: "assistant",
            content: data.reply
        });

        addMessage(data.reply, "bot");

        if (voiceEnabled) {
            speak(data.reply);
        }

        localStorage.setItem(
            "fridayHistory",
            JSON.stringify(conversation)
        );

        statusText.textContent = "● SYSTEM ONLINE";

    } catch (error) {

        loading.remove();

        addMessage(
            "Connection error: " + error.message,
            "bot"
        );

        statusText.textContent = "● CONNECTION ERROR";

    } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "SEND";
        input.focus();

    }
}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }

});

function speak(text) {

    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    const language =
        document.getElementById("language").value;

    const voices = speechSynthesis.getVoices();

    const matchingVoices = voices.filter(v =>
        v.lang.toLowerCase().startsWith(
            language === "bn-BD" ? "bn" : "en"
        )
    );

    const femaleNames = [
        "samantha", "ava", "karen", "moira",
        "tessa", "zira", "aria", "jenny"
    ];

    const femaleVoice = matchingVoices.find(v =>
        femaleNames.some(name =>
            v.name.toLowerCase().includes(name)
        )
    );

    if (femaleVoice) {
        speech.voice = femaleVoice;
    } else if (matchingVoices.length) {
        speech.voice = matchingVoices[0];
    }

    speech.lang = language;
    speech.rate = 0.78;
    speech.pitch = 1.08;
    speech.volume = 1;

    speechSynthesis.speak(speech);
}

function toggleVoice() {

    voiceEnabled = !voiceEnabled;

    document.getElementById("voiceBtn").textContent =
        voiceEnabled ? "🔊 VOICE ON" : "🔇 VOICE OFF";

    if (!voiceEnabled) {
        speechSynthesis.cancel();
    }
}

function startListening() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        alert("Voice recognition is not supported in this browser.");
        return;
    }

    const recognition = new Recognition();

    recognition.lang =
        document.getElementById("language").value;

    recognition.onresult = function(event) {

        input.value =
            event.results[0][0].transcript;

        sendMessage();
    };

    recognition.onerror = function() {
        alert("Microphone error. Please try again.");
    };

    recognition.start();
}

function clearChat() {

    if (!confirm("Clear all FRIDAY chat history?")) return;

    conversation = [];

    localStorage.removeItem("fridayHistory");

    chat.innerHTML = "";

    addMessage(
        "Hello! I am FRIDAY AI. 💙 How can I help?",
        "bot"
    );
}

function loadHistory() {

    try {
        conversation = JSON.parse(
            localStorage.getItem("fridayHistory") || "[]"
        );

        conversation.forEach(message => {
            addMessage(
                message.content,
                message.role === "user" ? "user" : "bot"
            );
        });

    } catch {
        conversation = [];
    }
}

loadHistory();

</script>

</body>
</html>
