<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIDAY AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #102849, #020712 75%);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 20px;
    color: #38c8ff;
    letter-spacing: 4px;
    font-size: 24px;
    font-weight: bold;
}

.status {
    text-align: center;
    color: #00ffae;
    font-size: 12px;
}

.core {
    width: 155px;
    height: 155px;
    margin: 35px auto 25px;
    border-radius: 50%;
    border: 3px solid #24bfff;
    box-shadow: 0 0 20px #008cff, inset 0 0 25px #008cff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    color: #65dcff;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 15px #008cff; }
    to { box-shadow: 0 0 45px #00c8ff, inset 0 0 30px #008cff; }
}

.controls {
    text-align: center;
    margin: 15px;
}

select, button, input {
    border: 1px solid #168bce;
    background: #07182c;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
}

select {
    width: 90%;
    max-width: 320px;
}

#chat {
    width: 92%;
    max-width: 600px;
    height: 260px;
    overflow-y: auto;
    margin: 15px auto;
    padding: 15px;
    border: 1px solid #1476b5;
    border-radius: 15px;
    background: rgba(0, 10, 25, .8);
}

.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.user {
    background: #123c60;
    text-align: right;
}

.bot {
    background: #092c36;
    color: #69e7ff;
}

.input-area {
    display: flex;
    gap: 8px;
    width: 92%;
    max-width: 600px;
    margin: 15px auto;
}

input {
    flex: 1;
    min-width: 0;
}

button {
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

.bottom {
    text-align: center;
    padding: 15px;
    color: #6d9bbd;
    font-size: 12px;
}
</style>
</head>

<body>

<header>FRIDAY AI</header>
<div class="status">● SYSTEM ONLINE</div>

<div class="core">FRIDAY</div>

<div class="controls">
    <select id="language" onchange="changeLanguage()">
        <option value="en-US">English</option>
        <option value="bn-BD">বাংলা (Bangla)</option>
    </select>
</div>

<div id="chat">
    <div class="message bot">
        Hello! I am FRIDAY AI. How can I help you?
    </div>
</div>

<div class="input-area">
    <input id="userInput" type="text"
    placeholder="Type your message...">

    <button onclick="sendMessage()">➤</button>
    <button onclick="startListening()">🎤</button>
</div>

<div class="controls">
    <button onclick="clearChat()">Clear Chat</button>
    <button onclick="toggleVoice()" id="voiceButton">
        Voice: ON
    </button>
</div>

<div class="bottom">
    FRIDAY AI • Personal Assistant
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const language = document.getElementById("language");

let voiceEnabled = true;

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}

function saveHistory() {
    localStorage.setItem("fridayChat", chat.innerHTML);
}

function loadHistory() {
    const saved = localStorage.getItem("fridayChat");
    if (saved) chat.innerHTML = saved;
}

function changeLanguage() {
    if (language.value === "bn-BD") {
        input.placeholder = "আপনার মেসেজ লিখুন...";
    } else {
        input.placeholder = "Type your message...";
    }
}

function getReply(text) {
    const msg = text.toLowerCase();
    const bangla = language.value === "bn-BD";

    if (msg.includes("hello") || msg.includes("hi") ||
        msg.includes("হ্যালো") || msg.includes("হাই")) {
        return bangla
            ? "হ্যালো! আমি FRIDAY AI। আপনাকে কীভাবে সাহায্য করতে পারি?"
            : "Hello! I am FRIDAY AI. How can I help you?";
    }

    if (msg.includes("your name") || msg.includes("তোমার নাম")) {
        return bangla
            ? "আমার নাম FRIDAY AI।"
            : "My name is FRIDAY AI.";
    }

    if (msg.includes("time") || msg.includes("সময়")) {
        return bangla
            ? "এখন সময় " + new Date().toLocaleTimeString("bn-BD")
            : "The current time is " + new Date().toLocaleTimeString();
    }

    if (msg.includes("date") || msg.includes("তারিখ")) {
        return bangla
            ? "আজকের তারিখ " + new Date().toLocaleDateString("bn-BD")
            : "Today's date is " + new Date().toLocaleDateString();
    }

    if (msg.includes("how are you") || msg.includes("কেমন আছ")) {
        return bangla
            ? "আমি ভালো আছি! আপনাকে সাহায্য করতে প্রস্তুত।"
            : "I am doing great! Ready to help you.";
    }

    return bangla
        ? "আপনার কথাটি বুঝেছি। তবে আমার AI ইঞ্জিন এখনো সংযুক্ত করা হয়নি।"
        : "I received your message, but my AI engine is not connected yet.";
}

function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    const reply = getReply(text);

    setTimeout(() => {
        addMessage(reply, "bot");

        if (voiceEnabled) {
            speak(reply);
        }

        saveHistory();
    }, 500);

    input.value = "";
    saveHistory();
}

 function speak(text) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    const lang = language.value;

    speech.lang = lang;
    speech.rate = 0.85;
    speech.pitch = 1.05;
    speech.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const matchingVoices = voices.filter(v =>
        v.lang.toLowerCase().startsWith(lang.substring(0, 2).toLowerCase())
    );

    const femaleVoice = matchingVoices.find(v =>
        /samantha|ava|karen|moira|tessa|zira|aria|jenny|female/i.test(v.name)
    );

    if (femaleVoice) {
        speech.voice = femaleVoice;
    } else if (matchingVoices.length > 0) {
        speech.voice = matchingVoices[0];
    }

    window.speechSynthesis.speak(speech);
}

function startListening() {
    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        alert("Voice input is not supported in this browser. Try Safari or another supported browser.");
        return;
    }

    const recognition = new Recognition();

    recognition.lang = language.value;
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        input.value = event.results[0][0].transcript;
        sendMessage();
    };

    recognition.onerror = function() {
        alert("Microphone error. Please check microphone permission.");
    };

    recognition.start();
}

function toggleVoice() {
    voiceEnabled = !voiceEnabled;

    document.getElementById("voiceButton").textContent =
        voiceEnabled ? "Voice: ON" : "Voice: OFF";

    if (!voiceEnabled && window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
}

function clearChat() {
    chat.innerHTML = "";
    localStorage.removeItem("fridayChat");
}

input.addEventListener("keypress", function(event) {
    if (event.key === "Enter") sendMessage();
});

loadHistory();

if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
}

</script>

</body>
</html>
